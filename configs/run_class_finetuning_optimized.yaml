# EVEREST-style classification finetuning with litdata optimized dataset (video + integer label)
# Streamed from S3. Uses schedule-free optimizers (RAdam/AdamW) and layer-wise LR decay.
# Run with: python run_class_finetuning_optimized.py --config configs/run_class_finetuning_optimized.yaml

data:
  # Optimized dataset: S3 URL or local path (created with litdata.optimize(), video + integer class)
  train_optimized_dir: "s3://your-bucket/optimized-labeled-videos"
  val_optimized_dir: null
  test_optimized_dir: null
  train_val_test_split: [0.8, 0.1, 0.1]  # Used when val/test dirs are null
  cache_dir: "cache/run_class_optimized"
  max_cache_size: '50GB'
  subset_ratio: null
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  cloud_type: 's3_public'

model:
  backbone: "vit-b"  # vit-s, vit-b, vit-l, vit-h
  pretrained_path: ""  # Path to pretrained checkpoint
  model_key: "model|module"
  model_prefix: ""
  num_classes: 101
  input_size: 224
  tubelet_size: 2
  fc_drop_rate: 0.0
  drop_rate: 0.0
  drop_path: 0.1
  attn_drop_rate: 0.0
  use_mean_pooling: true
  init_scale: 0.001
  use_checkpoint: false
  mcm: false
  mcm_ratio: 0.4

training:
  num_frames: 16
  num_segments: 1
  frames_to_sample: 16
  temporal_stride: 1
  batch_size: 32
  val_batch_size: 48  # Often 1.5 * batch_size
  max_epochs: 30
  update_freq: 1
  num_workers: 10
  pin_memory: true
  seed: 0
  steps_per_epoch: null  # Optional: cap steps per epoch (e.g. for streaming when len unknown)
  start_epoch: 0

optimizer:
  type: "radam"  # adamw or radam (schedule-free)
  lr: 1e-3
  weight_decay: 0.05
  betas: [0.9, 0.95]
  eps: 1e-8
  warmup_steps: 0
  layer_decay: 0.75  # < 1.0 for layer-wise LR decay

augmentation:
  label_smoothing: 0.1
  mixup: 0.0
  cutmix: 0.0
  cutmix_minmax: null
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  mixup_mode: "batch"

output:
  output_dir: "output/run_class_optimized"
  log_dir: "logs/run_class_optimized"
  save_ckpt: true
  save_ckpt_freq: 5  # Save every N epochs and at last epoch
  disable_eval_during_finetuning: false  # If true, no val/test loaders

# Optional: model EMA (exponential moving average)
model_ema:
  enable: false
  decay: 0.9999
  force_cpu: false
