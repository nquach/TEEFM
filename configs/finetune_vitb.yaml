# VideoMAE Finetuning Configuration (Classification)
# PyTorch Lightning + LitData StreamingDataset; schedule-free optimizer.
# Use run_finetuning.py --config configs/finetune_vitb.yaml

# Data: single train dir, or explicit val/test dirs. When val/test dirs are not set,
# litdata.train_test_split() is used with split_ratio to create train/val/test.
#
# LitData samples: require "video" + target under target_key (default "label").
# For eval.eval_protocol: multi_clip, each sample must include stable string data.video_id_key
# (default "video_id") so val/test clips aggregate to one prediction per logical video.
data:
  #train_optimized_dir: 's3://tee-2023-2024/labeled-datasets/opt-KRS-13views'
  train_optimized_dir: 's3://tee-2023-2024/labeled-datasets/opt-5k-2D'
  val_optimized_dir: null   # optional; if null (and test null), use train_test_split
  test_optimized_dir: null
  split_ratio: [0.8, 0.1, 0.1]  # [train, val, test]; used only when val/test dirs are null
  # Optional class-imbalance weighting for CE loss.
  # If enabled, provide counts for every class id in [0, num_classes-1].
  use_class_weights: false
  class_distribution: null  # e.g. {0: 238, 1: 38, 2: 118, 3: 1, 4: 2416, 5: 35}
  cache_dir: "./output/cache_finetune"
  num_classes: 62
  normalize_mean: [0.117, 0.114, 0.113]
  normalize_std: [0.208, 0.204, 0.203]
  max_cache_size: '100GB'
  cloud_type: 's3_public'
  video_id_key: filename   # LitData field used when eval.eval_protocol is multi_clip
  run_test_after_fit: true  # after fit, run trainer.test() on test split (default true); set false to skip

# Val/test evaluation protocol (train unchanged).
# single_clip: one random temporal window per row (default).
# multi_clip: deterministic UCF-style temporal x spatial grid; expands val/test dataset length;
#   Lightning logs val_video_* / test_video_* (mean softmax per video). DDP: metrics are per-rank
#   unless you validate on one device (clips for a video may be split across ranks).
eval:
  eval_protocol: multi_clip   # single_clip | multi_clip
  test_num_segment: 2
  test_num_crop: 3
  short_side_size: 256
  eval_center_crop_only: false  # if true: one center clip (smoke test), no grid expansion

# Model: encoder-only classification; pretrained_path = checkpoint from pretraining (encoder+decoder).
model:
  backbone: "vit-b"
  pretrained_path: "/teamspace/studios/this_studio/checkpoints/videomae_VitB_radam_LR1E3_BS64x16_-200-0.3081.ckpt.bin"
  model_key: "state_dict|model|module"
  model_prefix: ""
  num_frames: 16
  tubelet_size: 2
  input_size: 224
  fc_drop_rate: 0.0
  drop_rate: 0.0
  drop_path: 0.1
  attn_drop_rate: 0.0
  use_checkpoint: true
  use_mean_pooling: true
  init_scale: 0.001
  mcm: false
  mcm_ratio: 0.4
  crop_scale: [0.5, 1.0]
  crop_aspect_ratio: [0.8, 1.2]

# Training
training:
  batch_size: 32
  max_epochs: 75
  num_workers: 10
  pin_memory: true
  seed: 0
  num_frames: 16
  temporal_stride: 1
  frames_to_sample: 16
  gradient_clip_val: 0
  accumulate_grad_batches: 1
  strategy: "auto"

# Schedule-free optimizer (no LR scheduler)
optimizer:
  type: "radam"
  lr: 1e-3
  weight_decay: 0.05
  betas: [0.9, 0.99]
  eps: 1e-8
  warmup_steps: 0
  layer_decay: 0.75   # < 1.0 enables ViT layer-wise LR decay (omit or 1.0 to disable)

# Checkpointing
checkpoint:
  enable: true
  dir: "./output/checkpoints_finetune"
  prefix: "finetune_vitb_"
  save_top_k: 3
  save_last: true
  strict_top_k: false
  monitor: "val_f1"
  mode: "max"
  save_ckpt_freq: null

# Logging
logging:
  log_dir: "./output/logs_finetune"
  log_freq: 10
