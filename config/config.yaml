# Configuration file for VideoMAE training
# This file can be used for hyperparameter tuning

# Data configuration
data:
  train_csv: "mp4_paths.csv"
  val_csv: "val500_2023-2024.csv"
  batch_size: 8
  num_workers: 4
  num_frames_to_sample: 32
  temporal_stride: 2
  train_dataset_ratio: null  # Ratio of training dataset to use (0.0-1.0). If null, uses all data
  dataset_random_seed: null  # Random seed for dataset sampling (for reproducibility)

# Model configuration
model:
  backbone: "vit_s"  # Options: vit_s, vit_b, vit_l
  img_size: 224
  patch_size: 16
  mask_ratio: 0.75
  norm_pix_loss: true
  pretrained: null  # Path to pretrained weights, or null for random initialization

# Training configuration
training:
  learning_rate: 1.0e-4
  weight_decay: 0.05
  warmup_steps: 1000
  max_epochs: 100
  track_grad_norm: false  # Set to true to track L2 norm of gradients

# Checkpointing configuration
checkpointing:
  checkpoint_dir: "./checkpoints"
  checkpoint_prefix: "videomae"
  resume_from_checkpoint: null  # Path to checkpoint to resume from

# Logging configuration
logging:
  log_dir: "./logs"
  experiment_name: "videomae_experiment"

# Hardware configuration
hardware:
  gpus: 1
  precision: 32  # Options: 16, 32

